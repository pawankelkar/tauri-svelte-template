# https://docs.coderabbit.ai/getting-started/configure-coderabbit
language: en-GB

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: false
  review_status: false

  # Files where a line-by-line AI review is noise rather than signal.
  path_filters:
    - '!**/*.md'
    - '!pnpm-lock.yaml'
    - '!src-tauri/Cargo.lock'
    # Generated by tauri-specta — regenerate, never hand-edit.
    - '!src/lib/bindings.ts'
    # Vendored shadcn-svelte output.
    - '!src/lib/components/ui/**'
    # Translation catalogues; changes are content, not code.
    - '!locales/**'

  path_instructions:
    - path: 'src/lib/stores/**'
      instructions: >-
        Values crossing the Tauri IPC boundary must be unwrapped with
        $state.snapshot() — a raw Svelte 5 rune proxy does not serialise. Any
        store that debounces writes must expose a flush and be registered in
        flushAllStores() in src/lib/lifecycle.ts.
    - path: 'src/**'
      instructions: >-
        Rust is called through the generated bindings in
        $lib/tauri-bindings, never a raw invoke(). Logging goes through
        $lib/logger rather than console. User-facing strings come from
        i18next translation keys, not literals.
    - path: 'src-tauri/**'
      instructions: >-
        Commands are #[tauri::command] + #[specta::specta] returning
        Result<T, String>. Changing a command signature requires
        regenerating src/lib/bindings.ts via `pnpm run rust:bindings`.

chat:
  auto_reply: true

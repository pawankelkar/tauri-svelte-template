[package]
name = "ostralith-sync"
version = "0.1.0"
description = "Ostralith git backup: snapshots, per-note history and an optional remote push"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ostralith-core.workspace = true
thiserror.workspace = true
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "ssh", "https"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

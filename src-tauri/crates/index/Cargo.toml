[package]
name = "ostralith-index"
version = "0.1.0"
description = "Full-text search (tantivy) and fuzzy quick-open ranking for Ostralith vaults"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ostralith-core.workspace = true
thiserror.workspace = true
log.workspace = true
tantivy = { version = "0.26", default-features = false, features = ["mmap", "lz4-compression"] }
nucleo-matcher = { version = "0.3", default-features = false, features = ["unicode-normalization", "unicode-casefold"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[[bench]]
name = "search"
harness = false

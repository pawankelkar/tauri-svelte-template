[package]
name = "ostralith"
version = "0.1.0"
description = "Ostralith: a local-first AI notes and knowledge app"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

# The app crate is the workspace root so every existing path (CI, pnpm
# scripts, tauri.conf.json) keeps pointing at src-tauri/. Domain logic lives
# in crates/*; this crate stays a thin layer of Tauri commands over them.
[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.package]
authors = ["Ostralith contributors"]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
ostralith-core = { path = "crates/core" }
ostralith-net = { path = "crates/net" }
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
thiserror = "2"
url = "2"
tokio = { version = "1", default-features = false }

[lib]
name = "ostralith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
ostralith-core.workspace = true
ostralith-net.workspace = true
fontdb = "0.24"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
log.workspace = true

# Type-safe Tauri command bindings
specta.workspace = true
tauri-specta = { version = "=2.0.0-rc.21", features = ["typescript"] }
specta-typescript = "=0.0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
# The deep-link feature forwards a second launch's argv to the deep-link
# plugin, which is how scheme URLs reach a running app on Windows/Linux.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

# Phase 6: tauri-nspanel (macOS)

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
